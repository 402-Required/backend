server:
  port: ${PORT:8080}

spring:
  application:
    name: LoopCut
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000}

refresh-token:
  expires-days: ${REFRESH_TOKEN_EXPIRES_DAYS:30}

terms:
  version: ${TERMS_VERSION:2026-11-01}

google:
  web-client-id: ${GOOGLE_WEB_CLIENT_ID:}

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
